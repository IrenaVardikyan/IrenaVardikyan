<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Irena</title>
  <meta name="description" content="Get in touch with Irena.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { serif: ['Fraunces', 'Georgia', 'serif'], sans: ['"DM Sans"', 'system-ui', 'sans-serif'] },
      colors: { ink: '#1b2430', paper: '#f6f7f5', accent: '#1f5c5c' }
    } } }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap" rel="stylesheet">
</head>
<body class="bg-paper text-ink font-sans antialiased min-h-screen flex flex-col">
  <header class="max-w-5xl w-full mx-auto px-6 py-8 flex flex-wrap gap-4 justify-between items-center">
    <a href="index.html" class="font-serif text-xl font-semibold">Irena</a>
    <nav class="flex gap-8 text-sm font-medium">
      <a href="index.html" class="hover:text-accent">Home</a>
      <a href="book.html" class="hover:text-accent">The Book</a>
      <a href="contact.html" aria-current="page" class="underline underline-offset-8 decoration-accent decoration-2">Contact</a>
    </nav>
  </header>
  <main class="max-w-5xl w-full mx-auto px-6 pt-8 pb-20 grid md:grid-cols-5 gap-12">
    <div class="md:col-span-2">
      <h1 class="font-serif text-4xl md:text-5xl font-semibold">Say hello</h1>
      <p class="mt-5 text-lg leading-relaxed text-ink/80">Questions about the book, or just want to share what you thought? Send a message and I'll reply as soon as I can.</p>
    </div>
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="post" class="md:col-span-3 space-y-5">
      <div>
        <label for="name" class="block text-sm font-medium mb-1.5">Name</label>
        <input id="name" name="name" type="text" required class="w-full px-4 py-3 rounded-lg border border-ink/20 bg-white focus:outline-none focus:ring-2 focus:ring-accent">
      </div>
      <div>
        <label for="email" class="block text-sm font-medium mb-1.5">Email</label>
        <input id="email" name="email" type="email" required class="w-full px-4 py-3 rounded-lg border border-ink/20 bg-white focus:outline-none focus:ring-2 focus:ring-accent">
      </div>
      <div>
        <label for="message" class="block text-sm font-medium mb-1.5">Message</label>
        <textarea id="message" name="message" rows="6" required class="w-full px-4 py-3 rounded-lg border border-ink/20 bg-white focus:outline-none focus:ring-2 focus:ring-accent"></textarea>
      </div>
      <button type="submit" class="bg-accent text-white px-6 py-3 rounded-full font-medium hover:bg-ink transition-colors">Send message</button>
    </form>
  </main>
  <footer class="max-w-5xl w-full mx-auto px-6 py-10 mt-auto text-sm text-ink/60 border-t border-ink/10 flex flex-wrap gap-4 justify-between">
    <p>&copy; <span id="year">2026</span> Irena. All rights reserved.</p>
    <p class="flex gap-6">
      <a href="https://www.instagram.com/ivardikyan/" target="_blank" rel="noopener" class="hover:text-accent">Instagram</a>
      <!-- Replace the # below with the Goodreads link when it's ready -->
      <a href="#" target="_blank" rel="noopener" class="hover:text-accent">Goodreads</a>
    </p>
  </footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
